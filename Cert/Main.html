<div class="table-certd">


    <!-- CONTROLS -->

    <div class="controls">

        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔍 Search certs..."
        >


        <select id="categorySelect">

            <option value="All">
                All Categories
            </option>

            <option value="AWS">
                AWS
            </option>

            <option value="AGILE">
                AGILE
            </option>

            <option value="AZURE">
                AZURE
            </option>

            <option value="ORACLE">
                ORACLE
            </option>

            <option value="ITIL">
                ITIL
            </option>

        </select>


        <select id="sortSelect">

            <option value="category">
                Sort by Category
            </option>

            <option value="site">
                Sort by Name
            </option>

            <option value="year">
                Sort by Year
            </option>



        </select>


    </div>


    <!-- TABLE -->

    <table>

        <thead>

            <tr>

                <th>
                    Org
                </th>

                <th>
                    Cert
                </th>

                <th>
                    Category
                </th>

                <th>
                    Year
                </th>

            </tr>

        </thead>


        <tbody id="certTable">

        </tbody>

    </table>


    <div
        id="noResults"
        class="no-results">

        No certs found.

    </div>


</div>
