<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the user profile shape, leaving it perfectly transparent -->
    <mask id="user-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      <!-- Everything black cuts through to create transparency -->
      <g fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Head / Oval -->
        <rect x="41" y="27" width="18" height="24" rx="9" />
        <!-- Shoulders / Torso outline -->
        <path d="M 31 68 L 31 58 C 31 54, 35 50, 41 50 L 59 50 C 65 50, 69 54, 69 58 L 69 68" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent user mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#user-mask)" />
</svg>
